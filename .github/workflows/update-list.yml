name: "Chore: Update list"

on:
  workflow_dispatch:
    inputs:
      announce:
        description: Announce new and removed projects (GitHub release and Discord post).
        type: boolean
        default: true
      allow_mass_removal:
        description: Let this run remove more than 5 entries.
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * *' # every day at 03:00 UTC

permissions:
  contents: write

concurrency:
  group: update-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      has_payload: ${{ steps.payload.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
          cache: true

      - name: Install dependencies
        run: bun install

      - name: Update list
        run: bun cli.ts update --payload "$RUNNER_TEMP/announcement.json" ${{ inputs.allow_mass_removal && '--allow-mass-removal' || '' }}

      - name: Type-check, lint and test
        run: bun run check

      - name: Commit and push to main
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CHANGED=$(git status --porcelain -- state list-of-mods-seeking-translators.md | wc -l)
          if [ "$CHANGED" -gt 0 ]; then
            git add state list-of-mods-seeking-translators.md
            git commit -m "chore(state): list update"
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check for an announcement
        id: payload
        run: |
          if [ -f "$RUNNER_TEMP/announcement.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload announcement
        if: steps.payload.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: announcement
          path: ${{ runner.temp }}/announcement.json

  announce:
    needs: update
    # Scheduled runs have no inputs, and `null != false` is false in expressions.
    if: needs.update.outputs.has_payload == 'true' && (github.event_name != 'workflow_dispatch' || inputs.announce)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update.outputs.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
          cache: true

      - name: Install dependencies
        run: bun install

      - name: Download announcement
        uses: actions/download-artifact@v4
        with:
          name: announcement
          path: ${{ runner.temp }}

      - name: Announce
        run: bun cli.ts announce --payload "$RUNNER_TEMP/announcement.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
